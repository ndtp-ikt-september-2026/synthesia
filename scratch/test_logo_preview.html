<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Synthesia Logo Test Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 40px;
    background: #f1f5f9;
    font-family: 'Inter', sans-serif;
    color: #0f172a;
  }
  .preview-card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    padding: 30px;
    margin-bottom: 30px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 20px;
  }
  .header-simulation {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
  }
  .logo-img-48 {
    height: 48px;
    width: auto;
    display: block;
  }
  .logo-img-56 {
    height: 56px;
    width: auto;
    display: block;
  }
  .admin-navbar-sim {
    background: #ffffff;
    border-bottom: 1px solid #d8d8d8;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    border-radius: 8px;
  }
  .admin-logo-img {
    height: 34px;
    width: auto;
  }
  .dark-footer-sim {
    background: #0f172a;
    padding: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 30px;
  }
  .search-mock {
    flex: 1;
    max-width: 400px;
    height: 44px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    color: #94a3b8;
    font-size: 14px;
  }
  .btn-mock {
    background: #0f172a;
    color: #fff;
    padding: 10px 20px;
    border-radius: 9999px;
    font-weight: 700;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="preview-card">
  <div class="card-title">1. Storefront Header Simulation (Height: 48px)</div>
  <div class="header-simulation">
    <a href="#"><img src="synthesia_logo_transparent.png" class="logo-img-48" alt="SYNTHESIA"></a>
    <div class="search-mock">🔍 Поиск винила, CD, синтезаторов...</div>
    <div class="btn-mock">Каталог</div>
  </div>
</div>

<div class="preview-card">
  <div class="card-title">2. Storefront Header Simulation (Height: 56px)</div>
  <div class="header-simulation">
    <a href="#"><img src="synthesia_logo_transparent.png" class="logo-img-56" alt="SYNTHESIA"></a>
    <div class="search-mock">🔍 Поиск винила, CD, синтезаторов...</div>
    <div class="btn-mock">Каталог</div>
  </div>
</div>

<div class="preview-card">
  <div class="card-title">3. Admin Control Panel Navbar Simulation (Height: 34px)</div>
  <div class="admin-navbar-sim">
    <img src="synthesia_logo_transparent.png" class="admin-logo-img" alt="SYNTHESIA">
  </div>
</div>

</body>
</html>
