<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: url('Inter.ttf') format('truetype');
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: transparent;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .logo-box {
    display: inline-flex;
    align-items: center;
    background: #0f172a;
    padding: 14px 28px;
    gap: 15px;
  }

  .logo-icon svg {
    display: block;
    width: 28px;
    height: 28px;
    stroke: #38bdf8;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .logo-text {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.07em;
    color: #f8fafc;
    /* Optical chromatic aberration */
    text-shadow:
      -1.4px 0 0.4px rgba(56, 189, 248, 0.85),
       1.4px 0 0.4px rgba(245, 158, 11, 0.85);
    text-transform: uppercase;
    line-height: 1;
    position: relative;
    top: 1px;
  }

  /* Variant A: Rounded Squircle / Studio Badge (radius 16px) */
  #logoBadge16 {
    border-radius: 16px;
  }

  /* Variant B: Generous Rounded (radius 24px) */
  #logoBadge24 {
    border-radius: 24px;
  }

  /* Variant C: Full Pill / Capsule (radius 9999px) */
  #logoPill {
    border-radius: 9999px;
    padding: 14px 32px;
  }
</style>
</head>
<body>

  <div id="wrapA">
    <div id="logoBadge16" class="logo-box">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="4.2"></line>
        </svg>
      </div>
      <span class="logo-text">SYNTHESIA</span>
    </div>
  </div>

  <div id="wrapB">
    <div id="logoBadge24" class="logo-box">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="4.2"></line>
        </svg>
      </div>
      <span class="logo-text">SYNTHESIA</span>
    </div>
  </div>

  <div id="wrapC">
    <div id="logoPill" class="logo-box">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="4.2"></line>
        </svg>
      </div>
      <span class="logo-text">SYNTHESIA</span>
    </div>
  </div>

</body>
</html>
