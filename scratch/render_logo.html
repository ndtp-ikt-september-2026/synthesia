<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: url('Inter.ttf') format('truetype');
    font-weight: 800 900;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: transparent;
    display: inline-flex;
    padding: 0;
    margin: 0;
    overflow: hidden;
  }
  
  /* Variant 1: Exact screenshot match with #0f172a background */
  .logo-exact {
    background: #0f172a;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
  }
  
  .logo-icon svg {
    display: block;
    width: 26px;
    height: 26px;
    stroke: #38bdf8;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  
  .logo-text {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: #f8fafc;
    /* Chromatic aberration: subtle cyan on left, amber on right */
    text-shadow:
      -1.2px 0 0.5px rgba(56, 189, 248, 0.75),
       1.2px 0 0.5px rgba(245, 158, 11, 0.75);
    text-transform: uppercase;
    line-height: 1;
    display: block;
    position: relative;
    top: 1px;
  }
</style>
</head>
<body>

<div class="logo-exact" id="logoCard">
  <div class="logo-icon">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"></circle>
      <circle cx="12" cy="12" r="3"></circle>
      <line x1="12" y1="2" x2="12" y2="4.2"></line>
    </svg>
  </div>
  <span class="logo-text">SYNTHESIA</span>
</div>

</body>
</html>
