<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: url('Inter.ttf') format('truetype');
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: transparent;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 50px;
  }

  .logo-box {
    display: inline-flex;
    align-items: center;
    background: #0f172a;
    padding: 24px 52px;
    gap: 28px;
  }

  .logo-icon svg {
    display: block;
    width: 54px;
    height: 54px;
    stroke: #38bdf8;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .logo-text {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 46px;
    font-weight: 800;
    letter-spacing: 0.07em;
    color: #f8fafc;
    /* Optical chromatic aberration */
    text-shadow:
      -2.7px 0 0.8px rgba(56, 189, 248, 0.85),
       2.7px 0 0.8px rgba(245, 158, 11, 0.85);
    text-transform: uppercase;
    line-height: 1;
    position: relative;
    top: 2px;
  }

  /* Variant A: Rounded Squircle / Studio Badge (radius 32px at 2x = 16px at 1x) */
  #logoBadge32 {
    border-radius: 32px;
  }

  /* Variant B: Generous Rounded (radius 48px at 2x = 24px at 1x) */
  #logoBadge48 {
    border-radius: 48px;
  }

  /* Variant C: Full Pill / Capsule (radius 9999px) */
  #logoPill {
    border-radius: 9999px;
    padding: 24px 60px;
  }
</style>
</head>
<body>

  <div id="wrapA">
    <div id="logoBadge32" class="logo-box">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="4.2"></line>
        </svg>
      </div>
      <span class="logo-text">SYNTHESIA</span>
    </div>
  </div>

  <div id="wrapB">
    <div id="logoBadge48" class="logo-box">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="4.2"></line>
        </svg>
      </div>
      <span class="logo-text">SYNTHESIA</span>
    </div>
  </div>

  <div id="wrapC">
    <div id="logoPill" class="logo-box">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
          <line x1="12" y1="2" x2="12" y2="4.2"></line>
        </svg>
      </div>
      <span class="logo-text">SYNTHESIA</span>
    </div>
  </div>

</body>
</html>
